вати все.","Відчуття затишку супроводжуватиме тебе з ранку до вечора.","Твоя внутрішня сила сьогодні особливо помітна оточенню.","Зорі обіцяють день, після якого хочеться написати в щоденник.","Сьогодні все, що ти робиш з душею, отримає відгук.","Твій шлях освітлений — крокуй впевнено.","Хороший день, щоб навести лад — і в речах, і в думках.","Космос радить бути ніжною до себе й вимогливою до мрій.","Сьогоднішня енергія — як свіжі квіти: яскрава та надихаюча."],YC=["Твої {trait} сьогодні стануть ключем до успіху.","Саме {trait} допоможуть тобі знайти правильне рішення.","Оточення помітить твої {trait} — не соромся їх показувати.","Спирайся на свої {trait}, і день складеться ідеально.","Твої природні {trait} відкриють двері, які здавалися зачиненими.","Сьогодні {trait} — твоя суперсила."],QC=["Випий склянку води одразу після пробудження і посміхнися відображенню.","Запиши три речі, за які ти вдячна сьогодні.","Прогуляйся хоча б 15 хвилин без телефону.","Зроби одну справу, яку давно відкладала, — і відчуй легкість.","Подаруй комплімент людині поруч — він повернеться до тебе.","Влаштуй собі маленьке свято: улюблений напій чи десерт.","Скажи «ні» тому, що забирає твою енергію.","Знайди 10 хвилин для тиші та глибокого дихання.","Одягни щось, у чому почуваєшся неймовірно.","Напиши повідомлення людині, за якою скучила.","Розбери одну шухляду чи папку — простір очищує думки.","Сьогодні добре почати читати нову книжку.","Заплануй вечір лише для себе: ванна, свічки, улюблений серіал.","Розтягнися зранку — тіло подякує тобі весь день.","Не порівнюй себе з іншими: твій шлях унікальний.","Додай у день трохи кольору — квіти, аксесуар, помада.","Лягай сьогодні трохи раніше — сон творить дива.","Запиши одну велику мрію і перший крок до неї.","Послухай улюблену пісню і потанцюй, навіть якщо ніхто не бачить.","Похвали себе за щось маленьке — це важливо.","Приготуй щось смачне й корисне, з любов'ю до себе.","Поділися знанням чи порадою — це примножить твою удачу.","Спробуй щось нове, і, може змінити багато."]],qC=[["Енергії менше, ніж зазвичай, — відпочивай без докорів сумління.","Тіло просить турботи: більше сну, води й тепла.","Не перевантажуй себе — ресурс важливіший за швидкість."],["Енергія рівна — чудово для спокійного продуктивного дня.","Легка прогулянка чи йога додадуть бадьорості.","Збалансуй роботу та відпочинок — і день буде легким."],["Ти сповнена сил — ідеальний день для спорту й активностей!","Енергія б'є ключем — встигнеш більше, ніж планувала.","Твоя життєва сила надихає всіх довкола.","Ідеальний момент почати новий ритуал здоров'я."]],JC=["Я достатня. Я цінна. Я на своєму місці.","Я дозволяю собі бути щасливою вже сьогодні.","Кожен мій крок наближає мене до мрії.","Я обираю спокій замість тривоги.","Я гідна любові, турботи та радості.","Моє тіло — мій дім, і я дбаю про нього з любов'ю.","Я довіряю собі та своєму шляху.","Я притягую добрих людей і чудові можливості.","Я сяю, коли я — це просто я.","Мої мрії важливі, і я на них заслуговую.","Я відпускаю те, що не можу контролювати.","Я вдячна за цей день і все, що він приносить.","Я сильніша, ніж думаю.","У мені достатньо сил, щоб упоратися з усім.","Я створюю життя, яке люблю.","Мені не потрібно бути ідеальною, щоб бути чудовою.","Я розквітаю у своєму темпі.","Кожен день я стаю кращою версією себе.","Я заслуговую на відпочинок без почуття провини.","Мій спокій — мій пріоритет.","Достаток і радість легко приходять у моє життя.","Я цілком і повністю приймаю себе.","Я — джерело світла для себе та інших.","Сьогодні я обираю бути ніжною до себе.","Все, що мені потрібно, вже в мені.","Я відкрита до чудес.","Мої кордони — це прояв любові до себе.","Я вмію радіти маленьким речам.","Моя енергія безцінна, і я витрачаю її мудро.","Я дякую собі за все, що я роблю."],eN=[{name:"Пудрово-рожевий",hex:"#F4C2D0"},{name:"Лавандовий",hex:"#B8A4F4"},{name:"Персиковий",hex:"#FFC9A9"},{name:"М'ятний",hex:"#A8E6CF"},{name:"Золотистий",hex:"#F5CF7A"},{name:"Небесно-блакитний",hex:"#A7D3F5"},{name:"Фукс
